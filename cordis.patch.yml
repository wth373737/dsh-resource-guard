- insert:
    - id: resource-guard
      name: '@local/dsh-resource-guard'
      config:
        enabled: true
        mode: ask
        scope: heavy
        reserveGb: 6
        askRatio: 0.8
        denyRatio: 0.94
        vramAskRatio: 0.85
        vramDenyRatio: 0.97
        minEstimateGb: 4
        breaker: true
        breakerRatio: 0.92
        injectBudget: true
        learn: true
